services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rag_documents
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_local_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rag_user -d rag_documents
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_postgres_data:
